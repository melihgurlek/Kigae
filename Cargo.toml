[workspace]
resolver = "3"
members = ["crates/kigae-core", "crates/kigae"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
kigae-core = { path = "crates/kigae-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
